server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/myroboot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail:
    protocol: smtp
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    test-connection: false
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          connectiontimeout: 8000
          timeout: 8000
          writetimeout: 8000
          ssl:
            enable: ${MAIL_SSL_ENABLE:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:false}
  servlet:
    multipart:
      max-file-size: 220MB
      max-request-size: 240MB
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

support:
  upload-dir: ${UPLOAD_DIR:/app/uploads}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  auth:
    customer-username: ${CUSTOMER_USERNAME:customer}
    customer-password: ${CUSTOMER_PASSWORD:customer123}
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:admin123}

logging:
  level:
    org.springframework.jdbc.core: INFO
