services:
  mysql:
    image: mysql:8.0
    container_name: myroboot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-myroboot}
    ports:
      - "${MYSQL_BIND:-127.0.0.1}:${MYSQL_PORT:-3306}:3306"
    volumes:
      # Host bind mount: deleting/recreating the container does not delete DB files.
      - ${DATA_ROOT:-./data}/mysql:/var/lib/mysql
      # Runtime MySQL settings remain editable and recoverable on the host.
      - ./deploy/mysql/my.cnf:/etc/mysql/conf.d/myroboot.cnf:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    container_name: myroboot-backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-myroboot}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_MIN: ${DB_POOL_MIN:-3}
      CUSTOMER_USERNAME: ${CUSTOMER_USERNAME:-customer}
      CUSTOMER_PASSWORD: ${CUSTOMER_PASSWORD:-customer123}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      AUTH_SESSION_HOURS: ${AUTH_SESSION_HOURS:-168}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SUPPORT_PUBLIC_BASE_URL: ${SUPPORT_PUBLIC_BASE_URL:-}
      UPLOAD_CLEANUP_GRACE_HOURS: ${UPLOAD_CLEANUP_GRACE_HOURS:-24}
      UPLOAD_DIR: /app/uploads
      LOG_FILE: /app/logs/support.log
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-465}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SSL_ENABLE: ${MAIL_SSL_ENABLE:-true}
      MAIL_STARTTLS_ENABLE: ${MAIL_STARTTLS_ENABLE:-false}
      # Explicitly include host-mounted Spring configuration.
      SPRING_CONFIG_ADDITIONAL_LOCATION: optional:file:/app/config/
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8080}:8080"
    volumes:
      - ${DATA_ROOT:-./data}/uploads:/app/uploads
      - ${DATA_ROOT:-./data}/logs:/app/logs
      - ./backend/src/main/resources/application.yml:/app/config/application.yml:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build: ./frontend
    container_name: myroboot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-0.0.0.0}:${FRONTEND_PORT:-8088}:80"
    volumes:
      # Nginx runtime configuration is no longer trapped inside the image.
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_ROOT:-./data}/nginx-logs:/var/log/nginx
